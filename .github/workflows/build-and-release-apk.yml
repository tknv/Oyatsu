name: Build and Release APK

on:
  workflow_dispatch: 
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'develop'
  push:
    tags:
      - 'v*'  # バージョンタグ付きのプッシュ時に実行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 1.17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Build Tools
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Set PATH for Build Tools
        run: echo "export PATH=\$PATH:\$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Sign Android release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.OYATSU }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Set Build Tools Version
        run: echo "BUILD_TOOLS_VERSION=35.0.0" >> $GITHUB_ENV

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
