name: GitHub Events Telegram Notifications

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned, transferred, locked, unlocked]
  issue_comment:
    types: [created]
  push:
    tags:
      - '*'
  pull_request:
    types: [opened, reopened, closed, assigned, unassigned, labeled, unlabeled, synchronize, edited, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  send_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Telegram Message
        id: message_generator
        run: |
          EVENT_NAME="${GITHUB_EVENT_NAME}"
          REPOSITORY_NAME="${GITHUB_REPOSITORY}"
          ACTOR="${GITHUB_ACTOR}"
          REPOSITORY_URL="https://github.com/${GITHUB_REPOSITORY}"

          case "$EVENT_NAME" in
            issues)
              ISSUE_TITLE="${{ github.event.issue.title }}"
              ISSUE_NUMBER="${{ github.event.issue.number }}"
              ISSUE_URL="${{ github.event.issue.html_url }}"
              ACTION="${{ github.event.action }}"
              MESSAGE="🚨 *新しいIssueイベント: ${ACTION}* 🚨\nリポジトリ: [${REPOSITORY_NAME}](${REPOSITORY_URL})\nIssue #${ISSUE_NUMBER}: *${ISSUE_TITLE}*\n作成者/変更者: ${ACTOR}\n詳細: [こちら](${ISSUE_URL})"
              ;;
            issue_comment)
              ISSUE_TITLE="${{ github.event.issue.title }}"
              ISSUE_NUMBER="${{ github.event.issue.number }}"
              COMMENT_BODY="${{ github.event.comment.body }}"
              COMMENT_URL="${{ github.event.comment.html_url }}"
              MESSAGE="💬 *Issueコメントが追加されました* 💬\nリポジトリ: [${REPOSITORY_NAME}](${REPOSITORY_URL})\nIssue #${ISSUE_NUMBER}: *${ISSUE_TITLE}*\nコメント作成者: ${ACTOR}\nコメント: \"${COMMENT_BODY}\"\n詳細: [こちら](${COMMENT_URL})"
              ;;
            push)
              TAG_NAME="${GITHUB_REF#refs/tags/}"
              MESSAGE="🏷️ *新しいタグがプッシュされました* 🏷️\nリポジトリ: [${REPOSITORY_NAME}](${REPOSITORY_URL})\nタグ: ${TAG_NAME}\nプッシュしたユーザー: ${ACTOR}\n詳細: [リポジトリ](${REPOSITORY_URL}/releases/tag/${TAG_NAME})"
              ;;
            pull_request)
              PR_TITLE="${{ github.event.pull_request.title }}"
              PR_NUMBER="${{ github.event.pull_request.number }}"
              PR_URL="${{ github.event.pull_request.html_url }}"
              ACTION="${{ github.event.action }}"
              MESSAGE="🚀 *プルリクエストイベント: ${ACTION}* 🚀\nリポジトリ: [${REPOSITORY_NAME}](${REPOSITORY_URL})\nPR #${PR_NUMBER}: *${PR_TITLE}*\n作成者/変更者: ${ACTOR}\n詳細: [こちら](${PR_URL})"
              ;;
            pull_request_review)
              PR_TITLE="${{ github.event.pull_request.title }}"
              PR_NUMBER="${{ github.event.pull_request.number }}"
              PR_URL="${{ github.event.pull_request.html_url }}"
              REVIEW_STATE="${{ github.event.review.state }}"
              MESSAGE="👀 *プルリクエストレビューが提出されました* 👀\nリポジトリ: [${REPOSITORY_NAME}](${REPOSITORY_URL})\nPR #${PR_NUMBER}: *${PR_TITLE}*\nレビュー者: ${ACTOR}\nステータス: *${REVIEW_STATE}*\n詳細: [こちら](${PR_URL})"
              ;;
            pull_request_review_comment)
              PR_TITLE="${{ github.event.pull_request.title }}"
              PR_NUMBER="${{ github.event.pull_request.number }}"
              PR_URL="${{ github.event.pull_request.html_url }}"
              COMMENT_BODY="${{ github.event.comment.body }}"
              COMMENT_URL="${{ github.event.comment.html_url }}"
              MESSAGE="💬 *プルリクエストレビューコメントが追加されました* 💬\nリポジトリ: [${REPOSITORY_NAME}](${REPOSITORY_URL})\nPR #${PR_NUMBER}: *${PR_TITLE}*\nコメント作成者: ${ACTOR}\nコメント: \"${COMMENT_BODY}\"\n詳細: [こちら](${COMMENT_URL})"
              ;;
            *)
              MESSAGE="未定義のGitHubイベント: ${EVENT_NAME}"
              ;;
          esac

          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo -e "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.message_generator.outputs.message }}
          format: markdown
